[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "tilefoundry-ascend"
dynamic = ["version", "dependencies"]
description = "Huawei Ascend targets for TileFoundry."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]

[project.entry-points."tilefoundry.targets"]
ascend = "tilefoundry_ascend.ascend"

[tool.setuptools_scm]
root = "../.."

[tool.setuptools.packages.find]
include = ["tilefoundry_ascend", "tilefoundry_ascend.*"]

[tool.setuptools.package-data]
"tilefoundry_ascend.ascend.target.hardware" = [
    "*.toml",
]
