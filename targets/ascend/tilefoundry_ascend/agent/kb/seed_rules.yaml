  - rule_id: R20_LOOP_FISSION_REDUCE_SFU_HIDING
    symptom_family: COMPUTE_INEFFECTIVE_THROUGHPUT
    mechanism_tag: loop_fission_reduce_sfu_hiding
    concept_description: "Two-pass loop fission separating reduce/SFU chains from wide vfma accumulation"
    regime_guard: "is_legal and PIPE_M == 0 and PIPE_V > 0 and (has_coupled_reduce_sfu_accum or (l2_pmu_available == 1 and 0.0 < effective_compute_eta < 0.45 and measured_aiv_vec_ratio >= 0.35))"
    precondition: "(has_coupled_reduce_sfu_accum and (dominant_pipe in ('PIPE_V', 'AIV0.PIPE_V', 'AIV1.PIPE_V') or (l2_pmu_available == 1 and measured_aiv_vec_ratio >= 0.35))) or (l2_pmu_available == 1 and 0.0 < effective_compute_eta < 0.45 and measured_aiv_vec_ratio >= 0.35)"
    anti_precondition: "effective_compute_eta >= 0.60 or ub_occupancy_ratio > 0.82 or spill_bytes > 0"
    transform_template: |
      Split coupled reduce+SFU+wide-accumulation loops into two sequential loops (loop fission):
      Pass 1 computes row reductions and SFU ops (vcadd/vsqrt/vexp) and hoists the scalar
      reciprocal (1.0 / sum or rsqrt) into a scalar register while prefetching GM tiles; Pass 2
      streams wide vector multiply (T.simd.vmuls / vmul instead of elementwise vdiv) and
      vfma accumulation across vector chunks with short independent dependency chains.
    expected_postcondition: "not has_coupled_reduce_sfu_accum or PIPE_V < prev.PIPE_V"
    source_provenance: "ref:cann_dav3510_isa"
    alpha_prior: 2.5
    beta_prior: 1.0
    priority: 17
    compatible_backends: ["tilelang_dsl", "cce_trackb", "hybrid_trackb"]
    cpp20_transform_template: |
      Split coupled simd_inst::vcadd/vexp reductions from normalization, hoist the scalar
      reciprocal once after the reduction sum, and apply wide simd_inst::vmul (instead of
      elementwise vdiv) and simd_inst::vfma accumulation inside __simd_vf__ to hide SFU latency.
    rationale: "Hoisting scalar reciprocals into vmul and fissioning reduce/SFU from wide accumulation eliminates slow elementwise vdiv and SFU latency stalls."

  - rule_id: R21_SUBROW_DEPTH_OR_WIDTH_CORE_SHARDING
    symptom_family: GRID_TAIL_WAVE_UNDERUTIL
    mechanism_tag: subrow_depth_or_width_core_sharding
    concept_description: "Sub-row reduction depth or 64-element hidden-width core sharding across AIVs"
    regime_guard: "is_legal and PIPE_M == 0 and PIPE_V > 0 and (not grid_is_symbolic)"
    precondition: "(not grid_is_symbolic) and l0_cube_cycles == 0 and 0 < l0_grid_blocks < 2 and 0.0 < wave_occupancy < 0.35"
    anti_precondition: "any_overflow_bytes > 0 or spill_bytes > 0"
