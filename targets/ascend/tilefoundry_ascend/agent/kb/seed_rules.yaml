    expected_postcondition: "(not uses_dynamic_offset_pipelining) or alias_serialized_buffers < prev.alias_serialized_buffers or (not pseudo_double_buffer_serialized and prev.pseudo_double_buffer_serialized) or in_loop_pipe_all_barriers < prev.in_loop_pipe_all_barriers or measured_mte2_wait_ratio < prev.measured_mte2_wait_ratio"
