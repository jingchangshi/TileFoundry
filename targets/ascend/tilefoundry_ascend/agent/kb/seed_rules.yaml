  - rule_id: R27_L2_CACHE_BYPASS_SINGLE_USE
    symptom_family: DMA_L2_THRASH_REUSE_MISS
    mechanism_tag: l2_cache_bypass_single_use
    concept_description: "Bypass L2 allocation (CACHE_MODE_DISABLE) on single-use streaming operands"
    regime_guard: "PIPE_M > 0 or PIPE_MTE2 > 0"
