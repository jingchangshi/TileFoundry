    compatible_backends: ["tilelang_dsl", "cce_trackb", "hybrid_trackb"]
    cpp20_transform_template: |
      Enforce __launch_bounds__(512) and Simt::UintDiv inside __simt_vf__ with contention-free
      privatized accumulation using explicit scratch pointers and asc_atomic_add / asc_atomic_cas;
      never emit CUDA __shfl* intrinsics or raw integer __ubuf__ offset casts inside __simt_vf__.
    rationale: "Privatized accumulation, 512-thread launch bounds, and Simt::UintDiv eliminate global atomic contention and spills."

  - rule_id: R32_GROUPED_ROLLING_CORE_DISPATCH
    symptom_family: GRID_TAIL_WAVE_UNDERUTIL
    mechanism_tag: grouped_rolling_core_dispatch
    concept_description: "Grouped MatMul continuous rolling core rotation ((endBlockIdx+1)%coreNum) with BaseMBalance"
    regime_guard: "cube_to_vector_ratio > 0.0 and (iteration_regularity == 'ragged_group' or memory_ring == 'l0c_ub_epilogue')"
    precondition: "(not has_empty_group) and (0.35 <= wave_occupancy < 0.85 or (l2_pmu_available == 1 and measured_sync_stall_ratio > 0.10))"
    anti_precondition: "pseudo_double_buffer_serialized"
    transform_template: |
      Schedule grouped matrix tiles with continuous cross-group core rotation
      startBlockIdx = (endBlockIdx + 1) % coreNum (zero inter-group barriers), and balance each
      group dynamically across active cores via BaseMBalance.
    expected_postcondition: "wave_occupancy >= prev.wave_occupancy and measured_sync_stall_ratio <= prev.measured_sync_stall_ratio and is_legal"
    source_provenance: "ref:catlass"
    alpha_prior: 2.8
    beta_prior: 1.0
    priority: 12
    compatible_backends: ["tilelang_dsl", "cce_trackb", "hybrid_trackb"]
    cpp20_transform_template: |
      Rotate core indices continuously across groups using startBlockIdx = (endBlockIdx + 1) % coreNum
      with BaseMBalance in C++20 dispatch so inter-group barriers never stall active cores.
    rationale: "Rolling core assignment eliminates inter-group barrier bubbles and balances ragged group waves."

  - rule_id: R33_PERSISTENT_STATE_RESIDENCY
    symptom_family: DMA_REDUNDANT_GM_ROUNDTRIP
    mechanism_tag: persistent_state_residency
    concept_description: "Persistent on-chip UB/L1 FP32 state residency across iterations with initC=false"
    regime_guard: "has_loop_carried_state or memory_ring == 'persistent_onchip_state' or (transfer_inflation_ratio > 1.30 and working_set_sram_ratio <= 1.0)"
    precondition: "gm_roundtrip_bytes > 0 or in_loop_ub_reload_stores > 0 or (has_loop_carried_state and PIPE_MTE2 > 0) or (transfer_inflation_ratio > 1.30 and working_set_sram_ratio <= 1.0)"
    anti_precondition: "UB.overflow_bytes > 0 or L1.overflow_bytes > 0 or working_set_sram_ratio > 1.0"
    transform_template: |
      When transfer_inflation_ratio > 1.30 and the single-row working set fits in UB, fuse
      multi-pass stages into single-pass UB residency (load once from GM, keep row/tile
      resident in UB across reduction/normalization/epilogue, write final output once to GM).
      For recurrent kernels, bind persistent (B, H) ownership to cores and keep FP32 state
      resident inside UB/L1 across chunks with anchor = G_tail / 2 and L0C initC=false.
    expected_postcondition: "gm_roundtrip_bytes < prev.gm_roundtrip_bytes or in_loop_ub_reload_stores < prev.in_loop_ub_reload_stores or transfer_inflation_ratio < prev.transfer_inflation_ratio or PIPE_MTE2 <= prev.PIPE_MTE2"
    source_provenance: "ref:ops_transformer"
    alpha_prior: 2.9
    beta_prior: 1.0
    priority: 10
    compatible_backends: ["tilelang_dsl", "cce_trackb", "hybrid_trackb"]
    cpp20_transform_template: |
      Load single-row working sets into __ubuf__ once and keep intermediate passes resident in
      __ubuf__/__cbuf__ (zero GM roundtrips) when working_set_sram_ratio <= 1.0, and accumulate
      recurrent history in-place in __cc__ via asc_mmad(..., initC=false).
    rationale: "Single-pass UB residency and on-chip state persistence eliminate redundant GM read/write roundtrips."

  - rule_id: R34_SCALAR_LOOP_TO_VECTOR_DMA_PIPELINE
    symptom_family: SCALAR_LOOP_TRAP
    mechanism_tag: scalar_loop_to_vector_dma_pipeline
    concept_description: "Refactor scalar GM loops into contiguous UB/L1 DMA staging plus SIMD/Cube pipelines"
    regime_guard: "is_legal"
    precondition: "scalar_compute_loop_fallback > 0 or ub_scalar_compute_loops > 0 or (l0_cube_cycles == 0 and l0_vec_cycles == 0 and not has_simtvf) or (l2_pmu_available == 1 and aiv_vec_ratio < 0.15 and aic_mac_ratio < 0.10)"
    anti_precondition: "contig_atom_ratio < 1.0 or (l2_pmu_available == 1 and aiv_vec_ratio >= 0.15)"
    transform_template: |
      Replace scalar per-element global-memory loops with contiguous GM->UB (and GM->L1->L0C
      for matmul/attention) DMA block transfers followed by wide SIMD vector execution under
      T.SimdVF / simd_inst::* (or T.gemm / asc_mmad for matrix tiles) so vector/cube pipes
      stay saturated instead of stalling on PIPE_S scalar memory accesses.
    expected_postcondition: "(l0_vec_cycles > 0 or l0_cube_cycles > 0) and scalar_compute_loop_fallback == 0.0 and ub_scalar_compute_loops == 0"
    source_provenance: "ref:cann_dav3510_isa"
    alpha_prior: 3.5
    beta_prior: 1.0
    priority: 1
    compatible_backends: ["tilelang_dsl", "cce_trackb", "hybrid_trackb"]
    cpp20_transform_template: |
      Eliminate direct scalar __gm__ loops in __simt_vf__/__aicore__; stage contiguous tiles
      into __ubuf__ via 3-arg/8-arg asc_copy_gm2ub_align(), execute wide simd_inst::* vector
      passes (plus asc_copy_gm2l1_nd2nz / asc_mmad / asc_copy_l0c2ub for matmul/attention),
      and write back uniformly via asc_copy_ub2gm_align() without mixing PIPE_S GM stores.
    rationale: "Direct GM scalar loops starve all DMA, Vector SIMD, and Cube MMAD hardware pipelines."

  - rule_id: R35_PURE_VECTOR_DUAL_SUBCORE_SPLIT
    symptom_family: COMPUTE_1C2V_SUBCORE_IMBALANCE
    mechanism_tag: pure_vector_dual_subcore_split
    concept_description: "Pure-vector dual-subcore split via T.MixedKernel(blocks, sids=2) across paired AIVs"
    regime_guard: "l0_cube_cycles == 0 and AIV0.PIPE_V > 0"
    precondition: "l0_cube_cycles == 0 and AIV0.PIPE_V > 0 and AIV1.PIPE_V == 0"
    anti_precondition: "any_overflow_bytes > 0 or has_simtvf"
    transform_template: |
      Partition pure-vector tile rows across both paired AIV sub-cores via
      T.MixedKernel(blocks, sids=2) as (bx, sid) (or half_rows = row_tile // 2 per sub-core)
      so AIV0 and AIV1 execute vector DMA and SIMD compute concurrently.
    expected_postcondition: "AIV1.PIPE_V > 0 and AIV0.PIPE_V <= prev.AIV0.PIPE_V"
    source_provenance: "ref:tilelang"
    alpha_prior: 3.0
    beta_prior: 1.0
    priority: 10
    compatible_backends: ["tilelang_dsl", "cce_trackb", "hybrid_trackb"]
    cpp20_transform_template: |
      Split pure-vector tile work across paired AIV sub-cores using get_subblockid() == 0 vs 1
      and half_rows = row_tile / 2 in __vector__ kernels so both AIV0 and AIV1 run concurrently.
    rationale: "Pure-vector kernels using only AIV0 leave the paired AIV1 sub-core idle and halve effective vector and DMA throughput."

  - rule_id: R35_Z3_TASK_CYCLE_LATENCY_OVERRIDE
    symptom_family: SYNC_BARRIER_SERIALIZATION
    mechanism_tag: z3_task_cycle_latency_override
    concept_description: "Override Z3 task and VF cycle models via T.Task(latency, ii), T.SimdVF(latency), and T.SimtVF(threads, latency)"
    regime_guard: "is_legal and (PIPE_M > 0 or PIPE_V > 0 or PIPE_MTE2 > 0)"
    precondition: "(steady_state_ii > 1 or (l2_pmu_available == 1 and measured_sync_stall_ratio > 0.12)) and not pseudo_double_buffer_serialized"
    anti_precondition: "any_overflow_bytes > 0 or spill_bytes > 0"
    transform_template: |
      Override Z3 scheduler cycle estimates with measured task and VF latencies by grouping
      single-PIPE serial statements in with T.Task(latency=..., ii=...): (latency >= ii > 0)
      or annotating with T.SimdVF(latency=...): / with T.SimtVF(threads=..., latency=...):
      to eliminate mis-estimated critical-path serialization across independent hardware pipes.
    expected_postcondition: "(steady_state_ii <= prev.steady_state_ii or measured_sync_stall_ratio <= prev.measured_sync_stall_ratio) and is_legal"
    source_provenance: "ref:tilelang"
    alpha_prior: 2.6
    beta_prior: 1.0
    priority: 19
    compatible_backends: ["tilelang_dsl"]
    rationale: "Measured T.Task, T.SimdVF, and T.SimtVF cycle overrides align the Z3 scheduler with hardware pipe timings."

  - rule_id: R36_SUBATOM_CONTIGUOUS_ALIGNED_CORE_SLICE
    symptom_family: DMA_UNALIGNED_SHORT_BURST
    mechanism_tag: subatom_contiguous_aligned_core_slice
    concept_description: "Contiguous 32B-aligned multi-row core slicing for sub-atom tensors"
    regime_guard: "is_legal and (not has_indirect_gather) and (PIPE_V > 0 or PIPE_MTE2 > 0 or has_simtvf)"
    precondition: "contig_atom_ratio < 1.0 and ((l2_pmu_available == 1 and l2_hit_rate < 0.55) or dma_burst_efficiency_ratio < 0.85 or transfer_inflation_ratio > 1.02)"
    anti_precondition: "any_overflow_bytes > 0 or has_indirect_gather"
    transform_template: |
      When contig_atom_ratio < 1.0, partition work across AIV cores in contiguous multi-row
      32B-aligned slices rather than strided per-element or cross-core shared cache lines so
      each core issues full aligned GM->UB and UB->GM bursts without L2 cache-line thrashing
      or partial writeback amplification.
    expected_postcondition: "l2_hit_rate > prev.l2_hit_rate or dma_burst_efficiency_ratio > prev.dma_burst_efficiency_ratio or transfer_inflation_ratio < prev.transfer_inflation_ratio"
    source_provenance: "ref:cann_dav3510_isa"
    alpha_prior: 2.5
    beta_prior: 1.0
    priority: 13
    compatible_backends: ["tilelang_dsl", "cce_trackb", "hybrid_trackb"]
    cpp20_transform_template: |
      Assign contiguous >= 32B multi-row GM slices per core and align asc_copy_gm2ub_align() /
      asc_copy_ub2gm_align() block boundaries to 32B sectors to prevent L2 cache-line bouncing.
    rationale: "Contiguous 32B-aligned core slicing eliminates sub-atom cache-line false sharing and DMA burst waste."

  - rule_id: R37_SIMTVF_MULTIROW_ILP_CONSTANT_HOIST
    symptom_family: COMPUTE_INEFFECTIVE_THROUGHPUT
    mechanism_tag: simtvf_multirow_ilp_constant_hoist
    concept_description: "Hoist loop-invariant constants and multi-row accumulators inside T.SimtVF for ILP"
    regime_guard: "is_legal and has_simtvf"
    precondition: "has_simtvf and l2_pmu_available == 1 and l2_aiv_vec_ratio >= 0.50 and 0.0 < effective_compute_eta < 0.35"
    anti_precondition: "spill_bytes > 0 or any_overflow_bytes > 0"
    transform_template: |
      Inside T.SimtVF kernels with high vector activity but low effective throughput, hoist
      loop-invariant scalar parameters and reciprocal constants out of the inner thread loop,
      process multiple independent elements or rows per thread to expose instruction-level
      parallelism, and eliminate redundant divisions or repeated UB loads per inner step.
    expected_postcondition: "effective_compute_eta > prev.effective_compute_eta or PIPE_V < prev.PIPE_V"
    source_provenance: "ref:cann_dav3510_isa"
    alpha_prior: 2.5
    beta_prior: 1.0
    priority: 15
    compatible_backends: ["tilelang_dsl", "cce_trackb", "hybrid_trackb"]
    cpp20_transform_template: |
      Hoist loop-invariant constants and scalar reciprocals outside __simt_vf__ inner loops and
      unroll multi-row/multi-element accumulators per thread to increase ILP without UB spills.
    rationale: "Hoisting loop-invariant constants and multi-row ILP removes SIMT latency bubbles and redundant UB/SFU stalls."

  - rule_id: R38_COALESCE_SUB32B_TAIL_DMA_STORE
    symptom_family: DMA_UNALIGNED_SHORT_BURST
    mechanism_tag: coalesce_sub32b_tail_dma_store
    concept_description: "Coalesce sub-32B tail stores in UB into 32B-aligned bursts avoiding DCache bypass"
    regime_guard: "is_legal and (PIPE_MTE3 > 0 or PIPE_V > 0) and (not has_indirect_gather)"
    precondition: "dcache_bypass_narrow_store > 0.0 or (0 < min_gm_dma_bytes < 32)"
    anti_precondition: "any_overflow_bytes > 0 or transfer_inflation_ratio > 1.35"
    transform_template: |
      Coalesce sub-32B tail global-memory stores inside UB into 32B-aligned contiguous bursts
      via T.copy / asc_copy_ub2gm_align() instead of emitting narrow DCache-bypass scalar GM
      writes that amplify 64B cache-line writeback traffic on dav-3510.
    expected_postcondition: "dcache_bypass_narrow_store < prev.dcache_bypass_narrow_store or (dcache_bypass_narrow_store == 0.0 and min_gm_dma_bytes >= 32)"
    source_provenance: "ref:cann_dav3510_isa"
    alpha_prior: 2.8
    beta_prior: 1.0
    priority: 14
    compatible_backends: ["tilelang_dsl", "cce_trackb", "hybrid_trackb"]
    cpp20_transform_template: |
      Stage sub-32B tail outputs in __ubuf__ and emit 32B-aligned asc_copy_ub2gm_align()
      bursts instead of narrow scalar GM stores or write_gm_bypass_dcache.
    rationale: "Coalescing sub-32B tail stores in UB eliminates 64B DCache-bypass writeback amplification."

  - rule_id: R39_FIXPIPE_DEQ_SCALE_FOLD
    symptom_family: COMPUTE_FIXPIPE_ACCUM_IMBALANCE
    mechanism_tag: fixpipe_deq_scale_fold
    concept_description: "Fold quantization scale and x64 compensation directly into AIC FixPipe deq_scale epilogue"
    regime_guard: "has_lowbit_quant and AIC.PIPE_FIX > 0"
    precondition: "has_lowbit_quant and AIC.PIPE_FIX > 0 and PIPE_V < 0.85 * AIC.PIPE_M"
    anti_precondition: "effective_compute_eta >= 0.60 or L0C.overflow_bytes > 0"
    transform_template: |
      Fold the low-bit quantization x64 (0x42800000) compensation factor and per-channel
      dequantization scale directly into the AIC FixPipe deq_scale epilogue during L0C->UB
      drain instead of issuing a separate post-FixPipe AIV vector multiply pass.
    expected_postcondition: "is_legal and (AIC.PIPE_FIX <= prev.AIC.PIPE_FIX or steady_state_ii <= prev.steady_state_ii or effective_compute_eta > prev.effective_compute_eta)"
    source_provenance: "ref:ops_tensor"
    alpha_prior: 2.8
    beta_prior: 1.0
    priority: 14
    compatible_backends: ["tilelang_dsl", "cce_trackb", "hybrid_trackb"]
    cpp20_transform_template: |
      Fold the x64 nibble-shift compensation and scale into asc_copy_l0c2ub() FixPipe deq_scale
      operands after asc_mmad() so post-drain AIV rescaling is eliminated.
    rationale: "FixPipe deq_scale folding absorbs low-bit scale multiplication inside L0C drain at zero extra vector cost."

  - rule_id: R40_SIMTVF_FP32_WIDEN_BEFORE_SUBBYTE_QUANT
    symptom_family: COMPUTE_VECTOR_LOOP_DEGRADED
    mechanism_tag: simtvf_fp32_widen_before_subbyte_quant
    concept_description: "Widen sub-byte operands to FP32 inside T.SimtVF before scale and clamp quantization"
    regime_guard: "is_legal and has_lowbit_quant and has_simtvf"
    precondition: "has_lowbit_quant and has_simtvf and ((not vloopv2_hit) or spill_bytes > 0 or PIPE_V > 0)"
    anti_precondition: "UB.overflow_bytes > 0 or ub_occupancy_ratio > 0.88"
    transform_template: |
      Widen sub-byte (FP4/FP8/INT4) operands to FP32 in UB or RegBase vector registers before
      applying per-group scale, reciprocal, and rounding/clamp inside __simd_vf__ or
      __simt_vf__, then pack cleanly on store without scalar per-element fallback loops.
    expected_postcondition: "spill_bytes <= prev.spill_bytes and is_legal"
    source_provenance: "ref:cann_dav3510_isa"
    alpha_prior: 2.7
    beta_prior: 1.0
    priority: 18
    compatible_backends: ["tilelang_dsl", "cce_trackb", "hybrid_trackb"]
    cpp20_transform_template: |
      Widen sub-byte operands to float32 inside __simt_vf__ before scale and clamp arithmetic,
      then emit packed aligned UB stores.
    rationale: "FP32 widening before sub-byte quantization prevents precision loss, scalar fallback, and register spills."

  - rule_id: R41_EMPTY_GROUP_ZERO_TOKEN_SKIP
    symptom_family: GRID_TAIL_WAVE_UNDERUTIL
    mechanism_tag: empty_group_zero_token_skip
    concept_description: "Fast-skip m == 0 empty groups while preserving mandatory L0C->UB SPLIT_M sync parity"
    regime_guard: "cube_to_vector_ratio > 0.0 and (has_empty_group or iteration_regularity == 'ragged_group' or memory_ring == 'l0c_ub_epilogue')"
