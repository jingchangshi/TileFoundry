    anti_precondition: "pseudo_double_buffer_serialized"
    transform_template: |
      Fast-skip m == 0 empty groups in grouped matrix dispatch while preserving mandatory
      empty-subblock wait/set sync parity on L0C->UB SPLIT_M so empty groups do not waste
      Cube/Vector cycles or deadlock cross-core sync flags.
    expected_postcondition: "measured_sync_stall_ratio <= prev.measured_sync_stall_ratio and is_legal"
    source_provenance: "ref:catlass"
    alpha_prior: 2.8
    beta_prior: 1.0
    priority: 12
    compatible_backends: ["tilelang_dsl", "cce_trackb", "hybrid_trackb"]
    cpp20_transform_template: |
      Add m == 0 empty-group fast-skip in C++20 grouped dispatch while preserving paired
      asc_sync_notify / asc_lock parity on asc_copy_l0c2ub() epilogue paths.
    rationale: "Fast-skipping m == 0 groups with preserved sync parity prevents idle group waves and empty-subblock deadlocks."
