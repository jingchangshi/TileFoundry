rules:
  - rule_id: R01_DUAL_COPY_1C2V_SPLIT
    symptom_family: COMPUTE_1C2V_SUBCORE_IMBALANCE
    mechanism_tag: dual_copy_1c2v_split
    concept_description: "1C2V row-splitting via dual_copy across paired AIV sub-cores"
    regime_guard: "(AIV0.PIPE_V > 0 or cube_to_vector_ratio > 0.0) and (l0_cube_cycles > 0 or (l2_pmu_available == 1 and l2_aic_mac_ratio > 0.01))"
    precondition: "(l0_cube_cycles > 0 or (l2_pmu_available == 1 and l2_aic_mac_ratio > 0.01)) and AIV0.PIPE_V > 0 and AIV1.PIPE_V == 0"
    anti_precondition: "any_overflow_bytes > 0 or (has_simtvf and cube_to_vector_ratio == 0.0)"
    transform_template: |
      Partition the dominant output-row tile extent evenly across the two paired vector sub-cores
      (half_rows = row_tile // 2) via T.dual_copy on coupled AIC->AIV L0C->UB writeout inside
      T.MixedKernel(blocks, sids=2) so AIV0 and AIV1 execute concurrently.
    expected_postcondition: "AIV1.PIPE_V > 0 and AIV0.PIPE_V <= prev.AIV0.PIPE_V"
    source_provenance: "ref:tilelang"
    alpha_prior: 3.0
    beta_prior: 1.0
    priority: 10
    compatible_backends: ["tilelang_dsl", "cce_trackb", "hybrid_trackb"]
    cpp20_transform_template: |
      Split row/tile work across paired AIV sub-cores (get_subblockid() == 0 vs 1,
      half_rows = row_tile / 2) for asc_copy_l0c2ub writeout and simd_inst vector passes
      with symmetric asc_sync_notify flags so both AIV sub-cores execute concurrently.
    rationale: "Coupled 1-AIC-to-2-AIV execution doubles effective vector throughput when both AIV sub-cores share the row work."

  - rule_id: R02_ONCHIP_L0C_TO_UB_DIRECT
    symptom_family: DMA_REDUNDANT_GM_ROUNDTRIP
    mechanism_tag: onchip_l0c_to_ub_direct
    concept_description: "Direct on-chip L0C->UB->L1 routing via CANN 9.3 15-arg asc_copy_l0c2ub without GM roundtrips"
    regime_guard: "cube_to_vector_ratio > 0.0"
    precondition: "AIC.PIPE_FIX > 0 and (gm_roundtrip_bytes > 0 or (AIV0.PIPE_MTE2 > 0 and UB.implicit_bloat_bytes > 0))"
    anti_precondition: "UB.overflow_bytes > 0 or L1.overflow_bytes > 0"
    transform_template: |
      Eliminate global-memory intermediate roundtrips between matrix accumulation and vector
      post-processing by routing direct on-chip L0C->UB via T.dual_copy(l0c, ub, unit_flag_ctrl=3)
      and UB->L1 feedback via on-chip buffers; fuse FixPipe dequant scale, clip, and unit_flag
      handoff across coupled 1C2V AIV0/AIV1 sub-cores and never emit deprecated L1->GM stores.
    expected_postcondition: "(gm_roundtrip_bytes < prev.gm_roundtrip_bytes or AIV0.PIPE_MTE2 <= prev.AIV0.PIPE_MTE2) and is_legal"
    source_provenance: "ref:cann_dav3510_isa"
    alpha_prior: 3.0
    beta_prior: 1.0
    priority: 15
    compatible_backends: ["tilelang_dsl", "cce_trackb", "hybrid_trackb"]
    cpp20_transform_template: |
      Replace intermediate GM workspace roundtrips with direct on-chip CANN 9.3 15-arg
      asc_copy_l0c2ub() + asc_set_l0c_copy_nz_para() FixPipe epilogue from L0C to __ubuf__ and
      asc_copy_ub2l1() back to __cbuf__ across paired AIV0/AIV1 sub-cores guarded by paired
      asc_sync_notify(PIPE_M, PIPE_FIX, ev) and asc_sync_notify(PIPE_V, PIPE_MTE3, ev).
    rationale: "3510 hardware supports native 15-arg FixPipe L0C->UB and UB->L1 on-chip pipes without draining through global HBM."

  - rule_id: R03_ACCUM_SPAN_FIXPIPE_RELIEF
    symptom_family: COMPUTE_FIXPIPE_ACCUM_IMBALANCE
    mechanism_tag: accum_span_fixpipe_relief
    concept_description: "Enlarge K-accumulation span in L0C to amortize FixPipe writeout cost"
    regime_guard: "cube_to_vector_ratio > 0.0"
    precondition: "AIC.PIPE_FIX > 1.15 * AIC.PIPE_M and AIC.PIPE_M > 0"
    anti_precondition: "L1.overflow_bytes > 0 or L0C.overflow_bytes > 0 or ub_occupancy_ratio > 0.88"
    transform_template: |
      Enlarge the inner reduction-K accumulation span per FixPipe drain or fuse epilogue scale
      before FixPipe writeout (<= 128 B/cycle ceiling) so L0C accumulation amortizes FixPipe cost
      while staying within L0C and L1 capacity limits.
    expected_postcondition: "AIC.PIPE_FIX <= 1.15 * AIC.PIPE_M or AIC.PIPE_M > prev.AIC.PIPE_M"
    source_provenance: "ref:ops_transformer"
    alpha_prior: 2.5
    beta_prior: 1.0
    priority: 20
    compatible_backends: ["tilelang_dsl", "cce_trackb", "hybrid_trackb"]
    cpp20_transform_template: |
      Enlarge inner K steps accumulated in __cc__ before calling asc_copy_l0c2ub() by keeping
      initC=false on subsequent asc_mmad() iterations while staying within L1/L0C capacity.
    rationale: "Increasing K steps between L0C drains raises cube compute per FixPipe byte emitted."

  - rule_id: R04_MTE2_SPARSE_GATHER_COALESCE
    symptom_family: DMA_UNALIGNED_SHORT_BURST
    mechanism_tag: mte2_sparse_gather_coalesce
    concept_description: "Coalesce fragmented indirect or strided GM loads into 32B-aligned MTE2 bursts or vgather2"
    regime_guard: "has_indirect_gather or unaligned_dma_padding_bytes > 0 or mte2_inflight_per_aiv > 0"
    precondition: "mte2_inflight_per_aiv > 16 or unaligned_dma_padding_bytes > 0 or has_indirect_gather"
    anti_precondition: "transfer_inflation_ratio > 1.35 and gm_roundtrip_bytes > 0"
    transform_template: |
      Coalesce fragmented indirect or strided DMA loads into 32B-aligned contiguous block transfers
      or vector T.simd.vgather2 table lookups in UB so per-AIV outstanding MTE2 issue depth stays
      at or below the 16-entry hardware MTE2 queue depth with zero sub-32B padding waste.
    expected_postcondition: "mte2_inflight_per_aiv <= 16 and unaligned_dma_padding_bytes <= prev.unaligned_dma_padding_bytes"
    source_provenance: "ref:ops_transformer"
    alpha_prior: 3.0
    beta_prior: 1.0
    priority: 12
    compatible_backends: ["tilelang_dsl", "cce_trackb", "hybrid_trackb"]
    cpp20_transform_template: |
      Coalesce fragmented GM loads into 32B-aligned asc_copy_gm2ub_align() or
      asc_copy_gm2l1_nd2nz() block transfers so MTE2 queue depth stays at or below 16 entries.
    rationale: "Fragmented MTE2 sub-loads saturate the 16-entry issue queue and waste bus transactions."

  - rule_id: R05_SSBUF_RING_METADATA_HANDOFF
    symptom_family: SYNC_BARRIER_SERIALIZATION
    mechanism_tag: ssbuf_ring_metadata_handoff
    concept_description: "Shared-scalar SSBUF cross-core handoff with on-chip L1/UB RingBuffers"
    regime_guard: "has_indirect_gather or has_dynamic_control or has_online_rescale_loop or SSBUF.explicit_bytes > 0"
    precondition: "(l2_pmu_available == 1 and measured_sync_stall_ratio > 0.15) or (has_dynamic_control and (PIPE_V > 0 or cube_to_vector_ratio > 0.0))"
    anti_precondition: "pseudo_double_buffer_serialized or SSBUF.overflow_bytes > 0"
    transform_template: |
      Move small cross-core descriptors, offsets, and rescale scalars into 8B-aligned 3 KiB SSBUF
      (T.alloc_ss with explicit zero-initialization of dirty initial slots and multi-version clocks)
      while keeping bulk tensor payloads inside on-chip L1/UB RingBuffers rather than GM workspace.
    expected_postcondition: "SSBUF.explicit_bytes <= 3072 and measured_sync_stall_ratio <= prev.measured_sync_stall_ratio"
    source_provenance: "ref:cannbot_dsl"
    alpha_prior: 2.5
    beta_prior: 1.0
    priority: 18
    compatible_backends: ["tilelang_dsl"]
    rationale: "SSBUF provides low-latency (~8-cycle) shared scalar storage across 1 AIC + 2 AIV without GM roundtrips."

  - rule_id: R06_ONLINE_SOFTMAX_SKIP_SCALE
    symptom_family: COMPUTE_INEFFECTIVE_THROUGHPUT
    mechanism_tag: online_softmax_skip_scale
    concept_description: "Defer epilogue normalization and guard intermediate rescaling with max-shift threshold"
    regime_guard: "has_online_rescale_loop"
    precondition: "PIPE_V > PIPE_M and PIPE_V > 0"
    anti_precondition: "effective_compute_eta >= 0.60 or spill_bytes > 0"
    transform_template: |
      Defer output accumulator normalization to the final epilogue and guard intermediate output
      rescaling with a log-space max-shift threshold so identity-scale chunks skip redundant
      vector multiply-add passes over the accumulator tile.
    expected_postcondition: "PIPE_V < prev.PIPE_V"
    source_provenance: "ref:ops_transformer"
    alpha_prior: 2.5
    beta_prior: 1.0
    priority: 22
    compatible_backends: ["tilelang_dsl", "cce_trackb", "hybrid_trackb"]
    cpp20_transform_template: |
      Defer accumulator normalization to epilogue and guard intermediate simd_inst::vmul
      rescaling inside __simd_vf__ with a max-shift threshold to skip identity-scale passes.
    rationale: "Guarded skip-scale cuts vector multiply pressure on online reduction pipelines."

  - rule_id: R07_IMPLICIT_BLOAT_HEADROOM_TRIM
    symptom_family: SRAM_REGISTER_SPILL_STACK
    mechanism_tag: implicit_bloat_headroom_trim
    concept_description: "Trim tile blocking by one divisor step to reserve compiler implicit-bloat headroom"
    regime_guard: "implicit_bloat_bytes > 0 or any_overflow_bytes > 0 or degraded_buffer_count > 0"
    precondition: "UB.overflow_bytes > 0 or L1.overflow_bytes > 0 or degraded_buffer_count > 0"
    anti_precondition: "False"
    transform_template: |
      Trim the active tile blocking factor by one clean divisor step to reserve exact headroom for
      compiler-inserted implicit bloat (nd2nz scratch and fractal rounding) so multi-buffer
      versioning stays active (>= 2 versions) without single-buffering degradation or overflow.
    expected_postcondition: "UB.overflow_bytes == 0 and L1.overflow_bytes == 0 and degraded_buffer_count == 0"
    source_provenance: "ref:tilelang"
    alpha_prior: 3.5
    beta_prior: 1.0
    priority: 5
    compatible_backends: ["tilelang_dsl"]
    rationale: "Single-buffered degradation or scratchpad overflow destroys pipeline overlap far more than slightly smaller tiles."

  - rule_id: R08_PERSISTENT_SWIZZLE_L2_LOCALITY
    symptom_family: DMA_L2_THRASH_REUSE_MISS
    mechanism_tag: persistent_swizzle_l2_locality
    concept_description: "Persistent WINDOW_LEN=4 SWAT serpentine 2D block swizzling for L2 cache reuse"
    regime_guard: "wave_occupancy >= 0.75 or grid_blocks >= 28"
    precondition: "l2_pmu_available == 1 and (l2_hit_rate < 0.80 or (predicted_bottleneck_util > 0.75 and (unexplained_gap_ratio > 0.25 or measured_mte2_wait_ratio > 0.25)))"
    anti_precondition: "transfer_inflation_ratio > 1.35 and gm_roundtrip_bytes > 0"
    transform_template: |
      Wrap block dispatch in T.Persistent with WINDOW_LEN=4 SWAT serpentine 2D diagonal/group
      tile swizzling along M/N across active AIC groups (swizzle_window bounded by active block
      count) so co-scheduled tiles share resident operands in L2 cache and suppress cold MTE2 stalls.
    expected_postcondition: "l2_hit_rate > prev.l2_hit_rate or measured_mte2_wait_ratio < prev.measured_mte2_wait_ratio or unexplained_gap_ratio < prev.unexplained_gap_ratio"
    source_provenance: "ref:ops_transformer"
    alpha_prior: 2.7
    beta_prior: 1.0
    priority: 20
    compatible_backends: ["tilelang_dsl", "cce_trackb", "hybrid_trackb"]
    cpp20_transform_template: |
      Apply WINDOW_LEN=4 SWAT serpentine 2D block-index swizzling in the C++20 __aicore__
      dispatch loop so adjacent physical cores reuse shared A/B tiles in L2 cache and cut MTE2 stalls.
    rationale: "Persistent WINDOW_LEN=4 SWAT serpentine swizzling maximizes spatial reuse across the shared 128 MiB L2 cache."

  - rule_id: R09_MIXED_QUANT_DEQUANT_STAGE_OVERLAP
    symptom_family: COMPUTE_INEFFECTIVE_THROUGHPUT
    mechanism_tag: mixed_quant_dequant_stage_overlap
    concept_description: "Stage AIV UB dequantization one pipeline step ahead to overlap with Cube MMAD"
    regime_guard: "has_lowbit_quant"
    precondition: "cube_to_vector_ratio > 0.0 and PIPE_V > 0.85 * AIC.PIPE_M"
    anti_precondition: "effective_compute_eta >= 0.60 or ub_occupancy_ratio > 0.88 or spill_bytes > 0"
    transform_template: |
      Stage low-bit unpack and per-block scale-factor multiply inside AIV UB one pipeline stage ahead
      of Cube consumption and stream dequantized BF16/FP16 fragments into an L1 RingBuffer via
      UB->L1 direct transfer so AIV dequant overlaps concurrently with AIC MMAD.
    expected_postcondition: "steady_state_ii <= prev.steady_state_ii or PIPE_V <= prev.PIPE_V"
    source_provenance: "ref:cannbot_dsl"
    alpha_prior: 2.5
    beta_prior: 1.0
    priority: 20
    compatible_backends: ["tilelang_dsl", "cce_trackb", "hybrid_trackb"]
    cpp20_transform_template: |
      Stage low-bit unpack and scale multiply in __simd_vf__ UB buffers one iteration ahead,
      streaming via asc_copy_ub2l1() with asc_sync_notify parity to overlap with asc_mmad().
    rationale: "Overlapping AIV vector dequantization ahead of Cube MMAD hides mixed-precision unpacking latency."

  - rule_id: R10_BACKWARD_SYNC_CV_PINGPONG
    symptom_family: SYNC_BARRIER_SERIALIZATION
    mechanism_tag: backward_sync_cv_pingpong
    concept_description: "Dual-slot ping-pong parity sync decoupling AIC producer and paired AIV consumers"
    regime_guard: "cube_to_vector_ratio > 0.0 and (has_dynamic_control or PIPE_V > 0)"
    precondition: "(AIC.PIPE_M > 0 and PIPE_V > 0) and (steady_state_ii > 1 or (l2_pmu_available == 1 and measured_sync_stall_ratio > 0.12))"
    anti_precondition: "pseudo_double_buffer_serialized or any_overflow_bytes > 0"
    transform_template: |
      Decouple AIC producer and dual-AIV consumer execution using dual-slot ping-pong parity
      (slot = iter_idx % 2) across L0C/L1/SSBUF buffers with paired forward and backward
      cross-core flags under bounded counter budgets (counter delta <= 15).
    expected_postcondition: "steady_state_ii <= prev.steady_state_ii and measured_sync_stall_ratio <= prev.measured_sync_stall_ratio"
    source_provenance: "ref:cannbot_dsl"
    alpha_prior: 2.5
    beta_prior: 1.0
    priority: 24
    compatible_backends: ["tilelang_dsl", "cce_trackb", "hybrid_trackb"]
    cpp20_transform_template: |
      Use dual-slot ping-pong parity (slot = iter & 1) across __cbuf__/__ca__/__cb__/__ubuf__
      with paired asc_lock()/asc_unlock() and asc_sync_notify(..., (event_t)(iter & 1)).
    rationale: "Ping-pong parity flags allow one core side to compute iteration t+1 while the peer consumes iteration t."

  - rule_id: R11_L2_NZ_PAD_BANK_CONFLICT_AVOID
    symptom_family: SRAM_UB_L1_BANK_CONFLICT
    mechanism_tag: l2_nz_pad_bank_conflict_avoid
    concept_description: "NZ fractal stride padding for SRAM bank conflict avoidance"
    regime_guard: "dominant_contig_bytes >= 64 and dominant_contig_bytes % 256 == 0 and ub_utilization_ratio <= 0.75"
    precondition: "l2_pmu_available == 1 and unexplained_gap_ratio > 0.25 and (measured_mte2_wait_ratio > 0.15 or measured_aiv_vec_ratio > 0.0)"
    anti_precondition: "spill_bytes > 0 or ub_occupancy_ratio > 0.82"
    transform_template: |
      Pad internal N1 fractal major stride or stagger per-subcore UB bank offsets on 2D NZ scratchpads
      to eliminate shared-SRAM bank conflicts during SIMD vector loads and stores.
    expected_postcondition: "unexplained_gap_ratio < prev.unexplained_gap_ratio or UB.overflow_bytes == 0"
    source_provenance: "ref:cannbot_dsl"
    alpha_prior: 2.0
    beta_prior: 1.0
    priority: 30
    compatible_backends: ["tilelang_dsl", "cce_trackb", "hybrid_trackb"]
    cpp20_transform_template: |
      Add +16 or +32 element stride padding on __ubuf__ / __cbuf__ scratchpads to eliminate
      SRAM bank aliasing across simd_inst::vlds_norm and simd_inst::vsts_pack_b32.
    rationale: "Adding a minimal fractal stride pad breaks power-of-two bank aliasing on L1/UB NZ reads."

  - rule_id: R12_UNIT_FLAG_FIXPIPE_CHAIN_FUSION
    symptom_family: SYNC_BARRIER_SERIALIZATION
    mechanism_tag: unit_flag_fixpipe_chain_fusion
    concept_description: "Fine-grained hardware unit_flag handoff between MMAD and FixPipe"
    regime_guard: "cube_to_vector_ratio > 0.0 and AIC.PIPE_M > 0 and AIC.PIPE_FIX > 0"
    precondition: "(AIC.PIPE_M > 0 and AIC.PIPE_FIX > 0 and PIPE_V == 0) and (steady_state_ii > 1 or (l2_pmu_available == 1 and measured_sync_stall_ratio > 0.15))"
    anti_precondition: "pseudo_double_buffer_serialized"
    transform_template: |
      Enable hardware unit_flag handoff between T.gemm(unit_flag_ctrl=2/3) and its downstream
      FixPipe writeout T.dual_copy(..., unit_flag_ctrl=3) to replace coarse PIPE_M->PIPE_FIX
      barrier waits with fine-grained fractal completion signaling.
    expected_postcondition: "steady_state_ii <= prev.steady_state_ii and is_legal"
    source_provenance: "ref:tilelang"
    alpha_prior: 2.5
    beta_prior: 1.0
    priority: 26
    compatible_backends: ["tilelang_dsl"]
    rationale: "Hardware unit_flag handoffs eliminate full-tile FixPipe barrier bubbles between MMAD and drain."

  - rule_id: R13_SPLIT_KV_WAVE_RECOVERY
    symptom_family: GRID_TAIL_WAVE_UNDERUTIL
    mechanism_tag: split_kv_wave_recovery
    concept_description: "Grid block splitting across paired sub-cores for wave occupancy recovery"
    regime_guard: "is_legal and (PIPE_M > 0 or PIPE_V > 0 or PIPE_MTE2 > 0)"
    precondition: "(not grid_is_symbolic) and 0.0 < l0_wave_occupancy < 0.75 and ((l0_cube_cycles > 0 and 0 < l0_grid_blocks < num_aic_cores) or (l0_cube_cycles == 0 and 2 <= l0_grid_blocks < num_aiv_cores))"
    anti_precondition: "any_overflow_bytes > 0 or spill_bytes > 0"
    transform_template: |
      Split the outer reduction or key-value sequence dimension across multiple grid blocks and
      paired vector sub-cores with a partial-state merge epilogue (or T.set_atomic reduction) so
      active core wave occupancy scales above half-chip saturation.
    expected_postcondition: "wave_occupancy > prev.wave_occupancy or grid_blocks > prev.grid_blocks"
    source_provenance: "ref:ops_transformer"
    alpha_prior: 3.0
    beta_prior: 1.0
    priority: 8
    compatible_backends: ["tilelang_dsl", "cce_trackb", "hybrid_trackb"]
    cpp20_transform_template: |
      Split the outer reduction dimension across multiple grid blocks in the Track-B CCE (C++20)
      launcher and accumulate partial outputs before a final vector combine pass.
    rationale: "Low wave occupancy leaves most physical AIC and AIV cores idle during small-batch execution."

  - rule_id: R14_GQA_HEAD_M_FOLDING
    symptom_family: COMPUTE_INEFFECTIVE_THROUGHPUT
    mechanism_tag: gqa_head_m_folding
    concept_description: "Query-group head folding into Cube M-dimension for fractal utilization"
    regime_guard: "cube_to_vector_ratio > 0.0 and is_legal"
    precondition: "0 < effective_cube_m < 16"
    anti_precondition: "ub_occupancy_ratio > 0.82 or spill_bytes > 0"
    transform_template: |
      Fold grouped query heads sharing the same key-value head into the Cube M-dimension tile
      before T.gemm so effective_cube_m reaches at least 16 rows and densely fills the 16x16
      fractal MMAD datapath without zero-padding waste.
    expected_postcondition: "effective_cube_m >= 16 or effective_cube_m > prev.effective_cube_m"
    source_provenance: "ref:ops_transformer"
    alpha_prior: 3.0
    beta_prior: 1.0
    priority: 11
    compatible_backends: ["tilelang_dsl", "cce_trackb", "hybrid_trackb"]
    cpp20_transform_template: |
      Fold grouped query heads into the M dimension (M >= 16) before asc_copy_gm2l1_nd2nz() and
      asc_mmad() so the 16x16 Cube fractal unit runs densely without zero-padding waste.
    rationale: "Packing grouped heads along M saturates the 16-row Cube fractal unit on single-token decode."

  - rule_id: R15_ASYMMETRIC_1C2V_STAGE_FISSION
    symptom_family: SRAM_REGISTER_SPILL_STACK
    mechanism_tag: asymmetric_1c2v_stage_fission
    concept_description: "Asymmetric 1C2V stage fission and pipelined UB footprint compression"
    regime_guard: "cube_to_vector_ratio > 0.0 and AIV0.PIPE_V > 0 and AIV1.PIPE_V > 0"
    precondition: "ub_utilization_ratio > 0.80 or steady_state_ii > 8"
    anti_precondition: "False"
    transform_template: |
      Apply asymmetric 1C2V stage fission by narrowing per-stage UB slices and staggering Cube
      consumption against paired AIV vector stages via T.Pipelined double buffering so UB peak
      allocation drops below saturation and steady-state initiation interval shrinks.
    expected_postcondition: "UB.peak_allocated_bytes < prev.UB.peak_allocated_bytes or spill_bytes < prev.spill_bytes or steady_state_ii < prev.steady_state_ii"
    source_provenance: "ref:tilelang"
    alpha_prior: 2.5
    beta_prior: 1.0
    priority: 16
    compatible_backends: ["tilelang_dsl"]
    rationale: "Splitting heavy vector epilogues into slimmer pipelined stages prevents UB exhaustion and II stalls."

  - rule_id: R16_PADDED_PITCH_TAIL_MASKING
    symptom_family: DMA_UNALIGNED_SHORT_BURST
    mechanism_tag: padded_pitch_tail_masking
    concept_description: "32B-aligned UB pitch padding and SIMD tail masking for atom-aligned non-32B-multiple rows"
    regime_guard: "(not has_indirect_gather) and (PIPE_V > 0 or PIPE_MTE2 > 0 or has_simtvf)"
    precondition: "(not has_indirect_gather) and (not (0 < min_gm_dma_bytes < 32)) and dcache_bypass_narrow_store == 0.0 and contig_atom_ratio >= 1.0 and (unaligned_dma_padding_bytes > 0 or (has_simtvf and cube_to_vector_ratio == 0.0))"
    anti_precondition: "transfer_inflation_ratio > 1.35 and gm_roundtrip_bytes > 0"
    transform_template: |
      For atom-aligned rows (contig_atom_ratio >= 1.0, min_gm_dma_bytes >= 32) whose inner
      contiguous span is not a multiple of 32B, pad inner UB row pitch/stride to 32B alignment
      and replace scalar T.SimtVF loops with predicated vector T.SimdVF() tail masking so each
      row keeps 32B-aligned UB access and SIMD execution without unaligned padding waste.
    expected_postcondition: "unaligned_dma_padding_bytes < prev.unaligned_dma_padding_bytes or not has_simtvf or dma_burst_efficiency_ratio > prev.dma_burst_efficiency_ratio"
    source_provenance: "ref:cann_dav3510_isa"
    alpha_prior: 2.5
    beta_prior: 1.0
    priority: 14
    compatible_backends: ["tilelang_dsl", "cce_trackb", "hybrid_trackb"]
    cpp20_transform_template: |
      For atom-aligned rows (contig_atom_ratio >= 1.0, min_gm_dma_bytes >= 32) whose inner
      contiguous span is not a 32B multiple, pad UB row pitch to 32B alignment with
      asc_copy_gm2ub_align() / asc_copy_ub2gm_align() and use tail-masked simd_inst::* vector ops.
    rationale: "32B-aligned UB pitch padding and predicated SIMD tail masking eliminate alignment waste and scalar fallback on atom-aligned non-32B-multiple rows."

  - rule_id: R17_RMEM_ACCUMULATOR_HOIST
    symptom_family: SRAM_REGISTER_SPILL_STACK
    mechanism_tag: rmem_accumulator_hoist
    concept_description: "Hoist in-loop UB accumulator reloads and stores into register-resident vector scalars"
    regime_guard: "is_legal and in_loop_ub_reload_stores > 0"
    precondition: "in_loop_ub_reload_stores > 0"
    anti_precondition: "spill_bytes > 256"
    transform_template: |
      Hoist repeated in-loop UB accumulator reloads and stores into register-resident scalars or
      vectors across reduction steps so intermediate accumulation stays in vector registers
      without roundtripping through UB scratchpad slots.
    expected_postcondition: "in_loop_ub_reload_stores < prev.in_loop_ub_reload_stores and spill_bytes <= prev.spill_bytes"
    source_provenance: "ref:tilelang"
    alpha_prior: 2.5
    beta_prior: 1.0
    priority: 13
    compatible_backends: ["tilelang_dsl", "cce_trackb", "hybrid_trackb"]
    cpp20_transform_template: |
      Keep reduction accumulators in vector_f32 registers inside __simd_vf__ instead of
      reloading and storing intermediate results through __ubuf__.
    rationale: "Register-resident accumulation eliminates redundant in-loop UB load/store traffic."

  - rule_id: R18_WAVE_QUANTIZED_BURST_TILING
    symptom_family: DMA_UNALIGNED_SHORT_BURST
    mechanism_tag: wave_quantized_burst_tiling
    concept_description: "Wave-quantized pure-vector tiling co-selected with HBM DMA burst curve"
    regime_guard: "is_legal and PIPE_M == 0 and PIPE_V > 0 and PIPE_MTE2 > 0"
    precondition: "(not grid_is_symbolic) and (grid_blocks >= 2 or wave_occupancy >= 0.25) and (dma_burst_efficiency_ratio < 0.85 or wave_occupancy < 0.85)"
    anti_precondition: "ub_occupancy_ratio > 0.82 or spill_bytes > 0 or (transfer_inflation_ratio > 1.35 and gm_roundtrip_bytes > 0)"
    transform_template: |
      Select pure-vector row tile_rows to minimize (waves * tile_rows) / effective_burst_bw(tile_bytes):
      avoid small (< 16 KiB) GM DMA burst payloads that suffer segmented HBM bandwidth penalty
      by promoting tile_rows to reach 16-32 KiB per DMA burst when UB fits and wave count does
      not worsen. For idempotent row-independent outputs with total_rows >= tile_rows, clamp the
      tail block start row0 = min(block_idx * tile_rows, total_rows - tile_rows) to eliminate
      predicated cleanup branches.
    expected_postcondition: "dma_burst_efficiency_ratio > prev.dma_burst_efficiency_ratio or wave_occupancy > prev.wave_occupancy"
    source_provenance: "ref:cann_dav3510_isa"
    alpha_prior: 2.5
    beta_prior: 1.0
    priority: 14
    compatible_backends: ["tilelang_dsl", "cce_trackb", "hybrid_trackb"]
    cpp20_transform_template: |
      Tune tile_rows in _select_*_config() so asc_copy_gm2ub_align() / asc_copy_ub2gm_align()
      transfer 16-32 KiB per burst without adding core waves, clamping tail start row0 cleanly.
    rationale: "Joint wave quantization and GM burst-curve co-selection maximizes sustained AIV DMA throughput."

  - rule_id: R19_STATIC_PINGPONG_UNROLL_NO_ALIAS
    symptom_family: SYNC_PSEUDO_DOUBLE_BUFFER
    mechanism_tag: static_pingpong_unroll_no_alias
    concept_description: "CCE C++20 static 2x ping-pong buffer unrolling with explicit asc_sync_notify/wait"
    regime_guard: "is_legal and (uses_dynamic_offset_pipelining or pseudo_double_buffer_serialized or in_loop_pipe_all_barriers > 0)"
    precondition: "pseudo_double_buffer_serialized or in_loop_pipe_all_barriers > 0 or (l2_pmu_available == 1 and (measured_mte2_wait_ratio >= 0.32 or measured_sync_stall_ratio >= 0.20))"
    anti_precondition: "any_overflow_bytes > 0 or (pipeline_depth >= 2 and in_loop_pipe_all_barriers == 0 and not pseudo_double_buffer_serialized and measured_mte2_wait_ratio >= 0.40)"
    transform_template: |
