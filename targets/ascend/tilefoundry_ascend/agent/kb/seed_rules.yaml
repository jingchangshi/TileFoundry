      asc_copy_gm2ub_align() loads so cold weights do not evict reused activations from L2.
    rationale: "Bypassing L2 allocation on non-reused weights preserves L2 residency for shared activations."

  - rule_id: R28_INPLACE_L1_SLOT_ALIASING
