[surface]
cann_series = "cann_9_3"
cce_arch = "dav-3510"
hardware_series = "ascend_950"
display_label = "CCE C++20 (dav-3510 / CANN 9.3)"
default_std = "c++20"
required_compile_flags = ["--npu-arch=dav-3510", "--cce-aicore-only", "-x", "cce", "-std=c++20"]
umbrella_headers = [
  "#include <tl_templates/ascend/common.h>",
  "#include <tl_templates/ascend/gemm.h>",
  "#include <tl_templates/ascend/nd2nz_copy.h>",
  "#include <tl_templates/ascend/dcache_bypass.h>",
  "#include <tl_templates/ascend/reduce.h>",
  "#include <tl_templates/ascend/simd_inst.h>",
  "#include <c_api/asc_cube.h>",
  "#include <c_api/asc_simd.h>",
  "#include <c_api/asc_reg_vector.h>",
  "#include <simt_api/asc_simt.h>",
]
forbidden_tokens = [
  "kernel_operator.h",
  "using namespace AscendC;",
  "using namespace AscendC",
  "AscendC::",
  "910B",
  "tl::ascend::",
]

